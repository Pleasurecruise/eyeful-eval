[project]
name = "eyeful-eval"
version = "0.1.0"
description = "The evaluation of eyeful: building subjects from public benchmarks, reviewing them, scoring and analysing the reviews"
requires-python = ">=3.13"
dependencies = []

[tool.ruff]
src = ["eval"]
line-length = 160
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["analysis", "build", "core", "record", "review", "score", "tests"]
